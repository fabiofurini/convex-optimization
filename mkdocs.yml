# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Convex Optimization · Fabio Furini
site_description: >-
  Convex Optimization: the course lecture notes online, with definitions,
  theorems and proofs, worked examples and exercises with solutions.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/convex-optimization/
repo_url: https://github.com/fabiofurini/convex-optimization
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/convex-optimization/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/vector-curve
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/convex-optimization/
      lang: en

extra_css:
  - stylesheets/extra.css?v=d60085bd58

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=bf833266bf
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Preliminaries:
      - preliminaries/index.md
      - "1. Functions of several variables": preliminaries/01-functions-several-variables.md
      - "2. Convex sets": preliminaries/02-convex-sets.md
      - "3. Convex and concave functions": preliminaries/03-convex-concave-functions.md
      - "4. Quadratic functions": preliminaries/04-quadratic-functions.md
  - Optimization problems:
      - problems/index.md
      - "5. Optimization problems": problems/05-optimization-problems.md
      - "6. Convex and concave optimization problems": problems/06-convex-concave-problems.md
  - Exercises:
      - exercises/index.md
      - "1. Functions of several variables": exercises/ex-01-functions-several-variables.md
      - "2. Convex sets": exercises/ex-02-convex-sets.md
      - "3. Convex and concave functions": exercises/ex-03-convex-concave-functions.md
      - "4. Quadratic functions": exercises/ex-04-quadratic-functions.md
      - "5. Optimization problems": exercises/ex-05-optimization-problems.md
      - "6. Convex and concave optimization problems": exercises/ex-06-convex-concave-problems.md
  - Downloads: downloads.md
  - Full index: indice.md
